name: sgemd

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    # Sin `ports`: PostgreSQL no se publica en el host.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN}
      PROXY_MAX_BODY_MB: ${PROXY_MAX_BODY_MB}
      COOKIE_SECURE: ${COOKIE_SECURE}
      STORAGE_DIR: /app/storage
      BACKUPS_DIR: /app/backups
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
    # Sin `ports`: el backend solo es alcanzable a través de Caddy.

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      args:
        PROXY_MAX_BODY_MB: ${PROXY_MAX_BODY_MB}
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
      PROXY_MAX_BODY_MB: ${PROXY_MAX_BODY_MB}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
